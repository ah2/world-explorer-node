<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Explorer - Overture Maps</title>
    
    <!-- Use BASE_PATH for all resources -->
    <base href="/world-explorer/">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen">
            <div class="login-container">
                <h1>🌍 World Explorer</h1>
                <p style="color: #666; margin-bottom: 20px;">Powered by Overture Maps</p>
                <form id="login-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <div class="test-accounts">
                    <p>Test Accounts:</p>
                    <p>admin:adminpass | alice:alicepass | bob:bobpass</p>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" style="display:none">
            <div id="sidebar">
                <div class="user-info">
                    <h3>👤 <span id="username-display"></span></h3>
                    <p>⭐ Score: <span id="score-display">0</span></p>
                    <button id="logout-btn">Logout</button>
                </div>
                <div class="collected-places">
                    <h4>Collected Places</h4>
                    <ul id="collected-list"></ul>
                </div>
                <div class="instructions">
                    <h4>Controls</h4>
                    <p>WASD or Arrow Keys to move</p>
                    <p>Click markers to collect</p>
                    <p style="margin-top: 10px; font-size: 12px; color: #888;">
                        Data from Overture Maps
                    </p>
                </div>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
