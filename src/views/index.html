<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen">
            <div class="login-container">
                <h1>🌍 World Explorer</h1>
                <form id="login-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <div class="test-accounts">
                    <p>Test Accounts:</p>
                    <p>admin:adminpass | alice:alicepass | bob:bobpass</p>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" style="display:none">
            <div id="sidebar">
                <div class="user-info">
                    <h3>👤 <span id="username-display"></span></h3>
                    <p>⭐ Score: <span id="score-display">0</span></p>
                    <button id="logout-btn">Logout</button>
                </div>
                <div class="collected-places">
                    <h4>Collected Places</h4>
                    <ul id="collected-list"></ul>
                </div>
                <div class="category-filters" id="category-filters">
                    <h4>Filter by Category</h4>
                    <div class="filter-buttons">
                        <button onclick="filterPlacesByCategory('all')" class="filter-btn active">All</button>
                    </div>
                </div>

                <div id="loading-indicator" style="display: none; padding: 10px; text-align: center;">
                    Loading...
                </div>

                <div class="pagination-controls">
                    <button id="prev-page" onclick="loadPreviousPage()">Previous</button>
                    <span id="page-info">Page 1</span>
                    <button id="next-page" onclick="loadNextPage()">Next</button>
                </div>

                <div class="load-all-btn">
                    <button onclick="loadAllPlaces(currentLat, currentLng)" class="load-all-btn">
                        🗺️ Load All Places in Area
                    </button>
                </div>
                <div class="stats">
                    <h4>Statistics</h4>
                    <p>📊 Total Collected: <span id="total-collected">0</span></p>
                </div>
                <div class="instructions">
                    <h4>Controls</h4>
                    <p>WASD or Arrow Keys to move</p>
                    <p>Click markers to collect</p>
                </div>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/js/map.js"></script>
</body>

</html>
